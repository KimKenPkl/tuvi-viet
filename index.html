    <meta name="color-scheme" content="dark light" />
    <!-- Đặt nền trước khi React chạy để không nháy trắng/đen lúc tải. -->
    <script>
      (function () {
        try {
          var k = 'tuvi:giao-dien';
          var v = localStorage.getItem(k);
          if (v !== 'sang' && v !== 'toi') {
            v =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'sang'
                : 'toi';
          }
          var r = document.documentElement;
          r.dataset.giaoDien = v;
          r.style.colorScheme = v === 'sang' ? 'light' : 'dark';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', v === 'sang' ? '#f6f2e9' : '#0e1219');
        } catch (e) {}
      })();
    </script>
